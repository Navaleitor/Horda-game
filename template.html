<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Horda</title>
<style>
  /* Estilos base (game-architect). Los estilos del HUD los inyecta src/hud desde JS. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: default;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100;
    font-size: 18px; letter-spacing: 0.08em; color: #aaa; background: #000; white-space: pre-wrap; text-align: center; }
  #boot.error { color: #ff6a5a; font-family: ui-monospace, monospace; font-size: 13px; padding: 24px; align-items: flex-start;
    justify-content: flex-start; text-align: left; overflow: auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui-root"></div>
<div id="boot">Cargando…</div>
<!--BUNDLE-->
</body>
</html>
